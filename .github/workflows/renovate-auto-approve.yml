name: Renovate Auto Approve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same pull request supersedes the run judging the previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-auto-approve-renovate
  cancel-in-progress: true

permissions: {}

jobs:
  auto-approve-renovate:
    name: Auto Approve Renovate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write # To read the pull request and its commits, and to approve it
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Auto-approve Renovate PRs
        uses: TimSchoenle/actions/actions/maintenance/auto-approve-pr@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-maintenance-auto-approve-pr-v3.0.4
        with:
          token: ${{ github.token }}
          user_ids: '29139614,253958393' # Renovate, actions-maintenance-bot
          branch_pattern: '^renovate\/.*$'
          reject_forks: 'true'
          ignore_empty_prs: 'true'
