name: release-please
on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

env:
  DOCKER_REPO: timmi6790/cloudflare-access-webhook-redirect
  HELM_REPO: TimSchoenle/helm-charts
  CHART_PATH: charts/cloudflare-access-webhook-redirect

jobs:
  release-please:
    environment:
      name: release
      deployment: false
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create release commits and tags
      issues: write # Required to create release issues
      pull-requests: write # Required to create release PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.generate_token.outputs.token }}

  docker-build:
    environment:
      name: release
      deployment: false
    name: Docker Build (${{ matrix.arch }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read # Required to checkout the code
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is built on a native runner, so no QEMU emulation is involved
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the labels are consumed here; the tag configuration is kept in sync with the
      # docker-release job so that the derived version label matches the released tag.
      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      # Pushed without a tag: the per-architecture images are addressed by digest only
      # and are joined into a single tagged manifest list by the docker-release job.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKER_REPO }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            version=${{ needs.release-please.outputs.tag_name }}
            release=${{ needs.release-please.outputs.tag_name }}
            vendor=Timmi6790
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
          secrets: |
            sentry_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # Reuses the layers the push above already produced, so this is a layer export rather than a
      # second build. `docker-release` needs the document to attach to the digest and the labels to
      # check the index against, and it has no toolchain to generate either.
      - name: Export the generated configuration contract
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract
          outputs: type=local,dest=contract-out
          # The build arguments the `builder` chain this target depends on consumes, with the same
          # values the push above used. Anything different would change those layers' cache key and
          # turn a layer export into a full recompile — including the Sentry upload, which is why
          # its two arguments are here even though this target does not upload anything.
          build-args: |
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}

      # Per architecture rather than once, so `docker-release` can prove both architectures embed
      # the same document before it attaches one of them to the index that covers both.
      - name: Upload the configuration contract
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-${{ matrix.arch }}
          path: |
            contract-out/contract.json
            contract-out/contract.labels
          if-no-files-found: error
          retention-days: 1

  docker-release:
    environment:
      name: release
      deployment: false
    name: Docker Release
    needs: [ release-please, docker-build ]
    if: ${{ needs.release-please.outputs.release_created }}
    outputs:
      image_digest: ${{ steps.manifest.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required for OIDC authentication with Cosign
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # The scripts that check the index below live in the repository, so this job needs it. The
      # triggering commit is the release commit, which is the source the images were built from.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Reads the per-platform config blobs out of the manifest list. `docker buildx imagetools`
      # cannot do this per platform, and `--load` cannot take an index, which is why the label
      # check for a multi-platform build happens here rather than before the push.
      - name: Install Crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # Pinned to the version `terrace-config`'s contract plan names. When the chart repository's
      # consuming side lands it will pin one too, and the two should be reconciled then — a
      # difference in `oras` versions across the attach and the fetch is the kind of thing that
      # surfaces as an unexplained referrer mismatch.
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          version: 1.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKER_REPO }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Create and push manifest list
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO: ${{ env.DOCKER_REPO }}
        run: |
          tag_args=""
          for tag in ${TAGS}; do
            tag_args="${tag_args} --tag ${tag}"
          done
          docker buildx imagetools create ${tag_args} $(printf "${REPO}@sha256:%s " *)

      - name: Read manifest list digest
        id: manifest
        env:
          REFERENCE: ${{ env.DOCKER_REPO }}:${{ needs.release-please.outputs.tag_name }}
        run: |
          digest=$(docker buildx imagetools inspect "${REFERENCE}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Download the configuration contracts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/contracts
          pattern: contract-*

      # Both architectures generate the document from the same source tree with no revision or
      # timestamp threaded in, so they must agree byte for byte. If they ever did not, one of them
      # is describing a configuration surface the other image does not have, and attaching either
      # to an index covering both would publish a claim that is false for one architecture.
      - name: Verify both architectures generated the same contract
        run: |
          mapfile -t contracts < <(find /tmp/contracts -name contract.json | sort)
          if [ "${#contracts[@]}" -lt 2 ]; then
            echo "::error::Expected a contract from each architecture, found ${#contracts[@]}."
            exit 1
          fi
          for contract in "${contracts[@]:1}"; do
            if ! cmp "${contracts[0]}" "${contract}"; then
              echo "::error::The architectures generated different configuration contracts."
              exit 1
            fi
          done
          cp "${contracts[0]}" /tmp/contract.json
          cp "$(dirname "${contracts[0]}")/contract.labels" /tmp/contract.labels
          echo "Both architectures generated an identical contract ($(wc -c < /tmp/contract.json) bytes)."

      # The gate everything below is allowed to trust. It reads the index that was actually pushed,
      # per platform, because labels live in each manifest's own config blob — a differing base or
      # a per-platform build argument can leave one architecture carrying them and another not.
      #
      # The one call site the `rust/config-contract` action cannot take over, and the reason
      # `verify-contract-labels.sh` is still here. The action inspects a **local** image with
      # `docker inspect`; this walks a pushed manifest list with `crane`, reading each platform's
      # config blob out of the registry without pulling a layer. Handing it to the action would
      # mean pulling every platform to learn what `crane` already reads — and a loop over
      # platforms is not something one action step can express anyway.
      #
      # Two traps, both silent, both handled here:
      #
      #  - `crane config` reports `.config.Labels`, where `docker inspect` reports `.Config.Labels`.
      #    Reading the wrong one yields `null`; the script fails closed on `null` rather than
      #    treating it as nothing to compare.
      #  - `crane config` against an index without `--platform` does not fail loudly in every
      #    version, so the platform is always passed. The list is derived from the index rather than
      #    hardcoded, so it cannot drift from the build matrix — and the `unknown/unknown` entries
      #    that `provenance` and `sbom` add as attestations are filtered out, since they are not
      #    images and carry no config blob to inspect.
      - name: Verify every platform carries its contract labels
        env:
          REFERENCE: ${{ env.DOCKER_REPO }}@${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          platforms="$(crane manifest "${REFERENCE}" \
            | jq -r '.manifests[]
                     | select(.platform.os != null and .platform.os != "unknown")
                     | select(.platform.architecture != "unknown")
                     | "\(.platform.os)/\(.platform.architecture)"' \
            | sort -u)"

          if [ -z "${platforms}" ]; then
            echo "::error::No image platforms found in ${REFERENCE}; nothing was verified."
            exit 1
          fi

          echo "Verifying: $(echo "${platforms}" | tr '\n' ' ')"
          status=0
          for platform in ${platforms}; do
            crane config --platform "${platform}" "${REFERENCE}" \
              | jq -c '.config.Labels' > "labels.json"
            if ! bash .github/scripts/verify-contract-labels.sh \
                   labels.json /tmp/contract.labels "the ${platform} image"; then
              status=1
            fi

            # The same cross-check the pull-request build makes, repeated against what was actually
            # published: the copy embedded in this platform's filesystem is the document being
            # attached below. A stale in-image copy is the one failure nothing downstream can see.
            #
            # Both outcomes are reported rather than aborting the loop, so a run says what is wrong
            # with every platform instead of only the first.
            if ! crane export --platform "${platform}" "${REFERENCE}" - \
                 | tar -xOf - config/contract.json > from-image.json; then
              echo "::error::Could not read /config/contract.json out of the ${platform} image, so the embedded copy could not be compared."
              status=1
            elif ! cmp from-image.json /tmp/contract.json; then
              echo "::error::/config/contract.json in the ${platform} image is not the document being attached."
              status=1
            fi
          done
          exit "${status}"

      - name: Sign the images with GitHub OIDC Token
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      # Attached to the digest rather than to a tag: the referrer's subject is the exact build a
      # chart pins, so the contract cannot be for a different image than the one being deployed. A
      # tag can be moved; this cannot.
      #
      # The bytes are the ones the generator wrote, with nothing added afterwards. There is no
      # digest field to fill in — the attachment to a digest *is* the tie between image and
      # document.
      #
      # The reference is spelled out with its registry. `oras` does not apply Docker's implicit
      # `docker.io` default: it reads the first segment of a bare `user/repo` as a registry
      # hostname and tries to resolve it in DNS. Everything else in this job — buildx, crane,
      # cosign — defaults the registry itself, which is why this is the only place it is written.
      - name: Attach the configuration contract to the image
        env:
          REFERENCE: docker.io/${{ env.DOCKER_REPO }}@${{ steps.manifest.outputs.digest }}
        run: |
          cd /tmp
          oras attach --artifact-type application/vnd.terrace.config-schema.v1+json \
            "${REFERENCE}" contract.json:application/json

      # Keyless, against this workflow's identity. A chart repository vendoring the contract
      # verifies that identity against a regexp it pins, so the workflow file and the ref this runs
      # from are part of the contract's trust story: this is `release-please.yaml` on
      # `refs/heads/master`, not a tag-triggered `release.yml`.
      - name: Sign the configuration contract
        env:
          REPO: docker.io/${{ env.DOCKER_REPO }}
          REFERENCE: docker.io/${{ env.DOCKER_REPO }}@${{ steps.manifest.outputs.digest }}
        run: |
          # Polled rather than read once. Docker Hub's referrers index is eventually consistent:
          # the attach above returns as soon as the referrer manifest is stored, but
          # `/v2/.../referrers/<digest>` keeps answering with an empty index for seconds
          # afterwards. Reading it a single time immediately after attaching is a coin flip, and
          # losing it fails the release over a contract that is in fact attached.
          referrer=""
          discovered=""
          for attempt in 1 2 3 4 5 6; do
            if [ "${attempt}" -gt 1 ]; then
              sleep $(( (attempt - 1) * 5 ))
            fi

            discovered="$(oras discover \
              --artifact-type application/vnd.terrace.config-schema.v1+json \
              --format json "${REFERENCE}")"

            # `.referrers` is the shape oras 1.3 emits; `.manifests` is accepted so a version bump
            # that renames the field fails visibly here rather than signing nothing.
            referrer="$(printf '%s' "${discovered}" \
              | jq -r 'first((.referrers // .manifests // [])[].digest) // empty')"

            if [ -n "${referrer}" ]; then
              break
            fi
          done

          if [ -z "${referrer}" ]; then
            echo "::error::No configuration-contract referrer found on ${REFERENCE} within 75s of attaching it."
            printf '%s\n' "${discovered}"
            exit 1
          fi

          cosign sign --yes "${REPO}@${referrer}"
          echo "Signed the configuration contract at ${referrer}." >> "$GITHUB_STEP_SUMMARY"

  sentry-release:
    environment:
      name: release
      deployment: false
    name: Sentry Release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Sentry Release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3.7.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          version: ${{ needs.release-please.outputs.tag_name }}
          environment: production

  helm-release:
    environment:
      name: release
      deployment: false
    name: Helm Release
    needs: [ release-please, docker-release ]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: TimSchoenle/actions/actions/helm/update-chart-version@9278d7738d3db8b90a9943709721455576558724 # tag=actions-helm-update-chart-version-v1.6.1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          helm-repo: ${{ env.HELM_REPO }}
          chart-path: ${{ env.CHART_PATH }}
          images: |
            {
              "image.tag": {
                "tag": "${{ needs.release-please.outputs.tag_name }}",
                "digest": "${{ needs.docker-release.outputs.image_digest }}"
              }
            }
          app-version: ${{ needs.release-please.outputs.tag_name }}