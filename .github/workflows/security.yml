name: Security

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # jactionlint keeps every check of actionlint and has a rule for every zizmor audit. The shared
  # action runs the pedantic profile offline, so the result depends on the change alone, uploads the
  # SARIF to code scanning under the category jactionlint and fails on findings.
  # .github/jactionlint.yaml turns off the rules this repository does not want.
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@e2799424abd778c41e7f6d1547fd402386ef398e # tag=actions-security-jactionlint-v1.1.0
