name: Auto-Merge Release PRs

on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch:
    inputs:
      time_elapsed:
        description: 'Time elapsed since PR creation (e.g. "24h", "1d").'
        required: true
        default: '1d'

# A newer run supersedes a sweep still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-timed-auto-pr-approve
  cancel-in-progress: true

permissions: {}

jobs:
  auto-merge-releases:
    name: Auto Merge Releases
    # The maintenance app's secrets belong in the ci environment.
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every call is made with the app token minted below, so this job needs nothing from the
    # ambient `GITHUB_TOKEN`.
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      # The release pull requests are opened by automatic-release-manager, so the review comes from
      # the maintenance app: GitHub refuses a review from a pull request's own author. Scoped to what
      # the action does; without a `permission-*` input the token would inherit the whole installation.
      - name: Generate Bot Token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # to enable auto-merge
          permission-pull-requests: write # to list the pull requests and approve them

      - name: Approve and Auto-merge
        uses: TimSchoenle/actions/actions/maintenance/timed-auto-merge@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-maintenance-timed-auto-merge-v2.0.5
        with:
          token: ${{ steps.token.outputs.token }}
          trusted_authors: '253958393,248313786' # actions-maintenance-bot, automatic-release-manager
          branch_pattern: 'release-please--branches--%'
          pattern_mode: 'legacy'
          # `inputs` is empty on `schedule`, hence the fallback.
          time_elapsed: ${{ inputs.time_elapsed || '7d' }}
          # The floor a dispatch cannot go below. Deliberately not a dispatch input: lowering it has
          # to take a commit to this file.
          minimum_age: '1h'
          merge_method: 'squash'
