name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Turns every `warn` in `[workspace.lints]` into a failure for each job here, `clippy` among
  # them. Workflow-wide rather than per job so every job compiles with the same flags and shares
  # one set of cache fingerprints.
  RUSTFLAGS: "-D warnings"

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7

  # The upload authenticates with this job's OIDC token, so the job needs neither the `ci`
  # environment nor its `CODECOV_TOKEN`. `.github/codecov.yml` decides what the Codecov statuses
  # check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-rust-coverage-codecov-v2.0.4
        with:
          flags: rust

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  # Auto-format comes in two halves. `cargo fmt` runs the toolchain `rust-toolchain.toml` names
  # and honours any `rustfmt.toml`, both of which the pull request controls, so the half that runs
  # it holds no secret and a read-only `GITHUB_TOKEN` and hands on only a patch artifact. The second
  # half, in the `ci` environment, mints the maintenance App's token and commits that patch; it runs
  # nothing from the checkout, and `allowed_paths` refuses any path that is not Rust source.
  #
  # Pull requests only: the patch is committed to the pull request's branch, and a push to `master`
  # has none. Code reaches `master` through a pull request that already went through this.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yaml rather than with the rest of this workflow: both jobs commit to the
    # pull request branch through the API, which rejects a commit whose parent has moved. Racing
    # them would fail one of the two for a reason its log does not explain, so they queue. Only
    # this half takes the queue: the format job above writes nothing.
    concurrency:
      group: branch-writes-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the format job's output: that job ran the pull
      # request's code.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: rust-auto-format
          # Rust sources only: the only files `cargo fmt` rewrites. Any other path fails this job.
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13

  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      # The rustdoc lints in `Cargo.toml` only run under `rustdoc`, never under `cargo check` or
      # `cargo clippy`, which is why this job exists separately from `check` and `clippy`.
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # One feature set is enough here: nothing in the crate documentation is behind a `cfg`, so
      # `--all-features` renders every page there is. `config-schema` only adds the generator.
      - name: Render the documentation
        run: cargo doc --all-features --no-deps

      # `cargo nextest`, which the `test` job runs, does not run doctests.
      - name: Run the doctests
        run: cargo test --doc --all-features

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [ check, doc ]
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is built on a native runner, so no QEMU emulation is involved
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: cloudflare-access-webhook-redirect:test-${{ matrix.arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache of its architecture; only a push to `master` writes it.
      #
      # A pull request's export is stored under the pull request's ref, which `master` never
      # reads, but it counts against the repository's 10 GB Actions cache all the same. Each one
      # that rebuilt the cook layer added a compiled dependency tree per architecture, and GitHub
      # made room by evicting the least recently used entries, `master`'s among them. The cost is
      # that a pull request changing the manifests or the build stages cooks again on each push.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope=build-{0}', matrix.arch) || '' }}

      # One export, reusing the layers the build above already produced, so this costs a layer
      # export and nothing else. The `contract` stage holds only the two generated files —
      # exporting the builder stage itself would write the whole Rust toolchain to the runner.
      #
      # No `build-args`: the `cook` and `contract-builder` stages this target depends on declare
      # no `ARG` the build above sets, so their cache keys do not depend on any. If one is added,
      # it has to be passed here with the build's value, or this step recompiles the generator.
      - name: Export the generated configuration contract
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract
          outputs: type=local,dest=contract-out
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      # The checkpoint the whole scheme rests on. The `LABEL` region in the Dockerfile is
      # generated and pasted — a `LABEL` key cannot be interpolated, and `--label` on the command
      # line cannot reach a file produced inside a builder stage — so this is the only thing that
      # makes it true.
      #
      # The toolchain is here rather than at the top of the job because only this step needs it:
      # the action renders the labels from `src/config.rs` itself rather than trusting the file
      # the build wrote, which is what lets it check the Dockerfile's region and the committed
      # document in the same pass as the image.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # This job builds and loads a runtime image, and a restored cache is writable by any
          # branch: caching here is a path from a poisoned entry into a runtime artefact, which is
          # what zizmor's `cache-poisoning` audit flags. The only thing compiled is the contract
          # generator, so there is almost nothing to save.
          cache: false

      # It reads the built image, not the Dockerfile: a source diff cannot see a base image that
      # overrode a label, a `LABEL` line deleted on a branch nobody diffed, or a build argument
      # that silently failed to interpolate. `image` is the local tag the build above loaded, so
      # nothing is pulled — and the same run also compares the Dockerfile's marked region and the
      # committed document against what the types produce.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          features: config-schema
          image: ${{ env.IMAGE }}

      # The cross-check the dropped hash label would have bought. Both copies of the document are
      # here at once, which makes this free, and it is the one failure nothing downstream can see:
      # a chart reads the registry copy, so an image embedding a *stale* file would never be
      # caught anywhere else.
      #
      # `FROM scratch` has no shell, but `docker cp` does not need one — it reads the container's
      # filesystem without starting it.
      - name: Verify the embedded contract matches the exported one
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          container="$(docker create "${IMAGE}")"
          docker cp "${container}:/config/contract.json" from-image.json
          docker rm "${container}" > /dev/null
          if ! cmp from-image.json contract-out/contract.json; then
            echo "::error::/config/contract.json in the ${ARCH} image is not the document this build generated."
            exit 1
          fi
          echo "The ${ARCH} image's embedded contract matches the exported one."

      - name: Test Docker image runs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          # `webhook.paths` is a table, so it comes from the config file the image reads at
          # `/app/config.toml`. The scalars stay on the command line to keep both layers
          # exercised.
          cat > "${RUNNER_TEMP}/config.toml" <<'EOF'
          [webhook]
          target_base = "https://example.invalid"

          [webhook.paths]
          "/webhook/.*" = ["ALL"]
          EOF

          docker run -d --name smoke-test -p 8080:8080 \
            -v "${RUNNER_TEMP}/config.toml:/app/config.toml:ro" \
            -e WEBHOOK_REDIRECT_SERVER__HOST=0.0.0.0 \
            -e WEBHOOK_REDIRECT_SERVER__PORT=8080 \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_ID=ci-client-id \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_SECRET=ci-client-secret \
            "${IMAGE}"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health check passed on ${PLATFORM}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not become healthy on ${PLATFORM}"
          docker logs smoke-test
          exit 1

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      # Size warning above 150 MiB, Trivy scan at CRITICAL,HIGH, SARIF upload and the pull request
      # report in one step. `comment: summary` because a leg can only write its own comment: each
      # leg uploads a fragment instead, and `image-size-report` below posts one table for both
      # architectures. `sarif-category` is the category the inline upload used, so the existing
      # code-scanning alerts carry over instead of being orphaned under the derived
      # `trivy-linux-<arch>`.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-docker-image-check-v1.1.8
        with:
          image: ${{ env.IMAGE }}
          platform: ${{ matrix.platform }}
          sarif-category: trivy-${{ matrix.arch }} # Keeps the per-architecture scans from overwriting each other
          comment: summary

  image-size-report:
    name: Image Size Report
    # `always()`, so one failed leg does not cost the table the rows of the other. A leg that
    # failed before its fragment was uploaded is simply a missing row. Reporting only: nothing
    # should depend on this job.
    if: always() && github.event_name == 'pull_request'
    needs: docker-build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required by image-check-summary
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Comment image sizes on PR
        uses: TimSchoenle/actions/actions/docker/image-check-summary@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-summary-v1.1.6

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
