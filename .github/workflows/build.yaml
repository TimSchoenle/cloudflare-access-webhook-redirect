name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-cargo-check-v1.1.6

  coverage:
    name: Coverage
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-coverage-codecov-v1.1.41
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-auto-format-v1.1.12
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-clippy-v1.1.10

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is built on a native runner, so no QEMU emulation is involved
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: cloudflare-access-webhook-redirect:test-${{ matrix.arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      # One export, reusing the layers the build above already produced, so this costs a layer
      # export and nothing else. The `contract` stage holds only the two generated files —
      # exporting the builder stage itself would write the whole Rust toolchain to the runner.
      - name: Export the generated configuration contract
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract
          outputs: type=local,dest=contract-out
          # The same value the build above passed. `VERSION` is the only build argument the
          # `builder` chain this target depends on consumes, and a different value would change
          # those layers' cache key — turning a layer export into a full recompile.
          build-args: |
            VERSION=test
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      # The checkpoint the whole scheme rests on. The `LABEL` region in the Dockerfile is
      # generated and pasted — a `LABEL` key cannot be interpolated, and `--label` on the command
      # line cannot reach a file produced inside a builder stage — so this is the only thing that
      # makes it true.
      #
      # The toolchain is here rather than at the top of the job because only this step needs it:
      # the action renders the labels from `src/config.rs` itself rather than trusting the file
      # the build wrote, which is what lets it check the Dockerfile's region and the committed
      # document in the same pass as the image.
      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # This job builds and loads a runtime image, and a restored cache is writable by any
          # branch: caching here is a path from a poisoned entry into a runtime artefact, which is
          # what zizmor's `cache-poisoning` audit flags. The only thing compiled is the contract
          # generator, so there is almost nothing to save.
          cache: false

      # It reads the built image, not the Dockerfile: a source diff cannot see a base image that
      # overrode a label, a `LABEL` line deleted on a branch nobody diffed, or a build argument
      # that silently failed to interpolate. `image` is the local tag the build above loaded, so
      # nothing is pulled — and the same run also compares the Dockerfile's marked region and the
      # committed document against what the types produce.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-config-contract-v1.2.0
        with:
          features: config-schema
          image: ${{ env.IMAGE }}

      # The cross-check the dropped hash label would have bought. Both copies of the document are
      # here at once, which makes this free, and it is the one failure nothing downstream can see:
      # a chart reads the registry copy, so an image embedding a *stale* file would never be
      # caught anywhere else.
      #
      # `FROM scratch` has no shell, but `docker cp` does not need one — it reads the container's
      # filesystem without starting it.
      - name: Verify the embedded contract matches the exported one
        run: |
          container="$(docker create "${IMAGE}")"
          docker cp "${container}:/config/contract.json" from-image.json
          docker rm "${container}" > /dev/null
          if ! cmp from-image.json contract-out/contract.json; then
            echo "::error::/config/contract.json in the ${{ matrix.arch }} image is not the document this build generated."
            exit 1
          fi
          echo "The ${{ matrix.arch }} image's embedded contract matches the exported one."

      - name: Test Docker image runs
        run: |
          # `webhook.paths` is a table, so it comes from the config file the image reads at
          # `/app/config.toml`. The scalars stay on the command line to keep both layers
          # exercised.
          cat > "${RUNNER_TEMP}/config.toml" <<'EOF'
          [webhook]
          target_base = "https://example.invalid"

          [webhook.paths]
          "/webhook/.*" = ["ALL"]
          EOF

          docker run -d --name smoke-test -p 8080:8080 \
            -v "${RUNNER_TEMP}/config.toml:/app/config.toml:ro" \
            -e WEBHOOK_REDIRECT_SERVER__HOST=0.0.0.0 \
            -e WEBHOOK_REDIRECT_SERVER__PORT=8080 \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_ID=ci-client-id \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_SECRET=ci-client-secret \
            "${IMAGE}"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health check passed on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not become healthy on ${{ matrix.platform }}"
          docker logs smoke-test
          exit 1

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Check image size
        id: size-check
        run: |
          SIZE=$(docker image inspect "${IMAGE}" --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.arch }} # Keeps the per-architecture scans from overwriting each other

      - name: Comment image size on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          SIZE: ${{ steps.size-check.outputs.size }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            const { SIZE, PLATFORM } = process.env;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker image size (\`${PLATFORM}\`): **${SIZE}MB**`
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
