name: Build

on:
  push:
    branches: [ "master" ]

  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read # Required to checkout the code

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@5798c7bd8d1d98a0c7360114e91a0ac3b86bf145 # tag=actions-rust-cargo-check-v1.1.5

  coverage:
    name: Coverage
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@ae790481e6030046269b563631f778ffe4454321 # tag=actions-rust-coverage-codecov-v1.1.38
        with:
          codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@c6844b562767b6e68fff4d39bdf9eced6e29b318 # tag=actions-rust-test-v1.1.1

  fmt:
    name: Auto Format
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Auto Format
        uses: TimSchoenle/actions/actions/rust/auto-format@cf09acb4d66f357e85f979c9abf3442918a865a0 # tag=actions-rust-auto-format-v1.1.9
        with:
          bot_app_id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          bot_private_key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@dcfb46a6a17ad8565db74057ce60278953056ad5 # tag=actions-rust-clippy-v1.1.9

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
      pull-requests: write # Required to comment on PRs with image size
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each platform is built on a native runner, so no QEMU emulation is involved
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: cloudflare-access-webhook-redirect:test-${{ matrix.arch }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            version=test
            release=test
            vendor=Timmi6790
            VERSION=test
          cache-from: type=gha,scope=build-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.arch }}

      # One export, reusing the layers the build above already produced, so this costs a layer
      # export and nothing else. The `contract` stage holds only the two generated files —
      # exporting the builder stage itself would write the whole Rust toolchain to the runner.
      - name: Export the generated configuration contract
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract
          outputs: type=local,dest=contract-out
          # The same value the build above passed. `VERSION` is the only build argument the
          # `builder` chain this target depends on consumes, and a different value would change
          # those layers' cache key — turning a layer export into a full recompile.
          build-args: |
            VERSION=test
          cache-from: type=gha,scope=build-${{ matrix.arch }}

      # The checkpoint the whole scheme rests on. The `LABEL` block in the Dockerfile is
      # hand-written — a `LABEL` key cannot be interpolated, and `--label` on the command line
      # cannot reach a file produced inside a builder stage — so this is the only thing that makes
      # it true.
      #
      # It reads the built image, not the Dockerfile. `docker inspect` reports the label map under
      # `.Config.Labels`; `crane config` spells the same thing `.config.Labels`, and reading the
      # wrong one yields `null`. The script fails closed on `null` rather than treating it as
      # nothing to compare.
      - name: Verify the image carries its contract labels
        run: |
          docker inspect --format '{{json .Config.Labels}}' "${IMAGE}" > labels.json
          bash .github/scripts/verify-contract-labels.sh \
            labels.json contract-out/contract.labels "the ${{ matrix.arch }} image"

      # The cross-check the dropped hash label would have bought. Both copies of the document are
      # here at once, which makes this free, and it is the one failure nothing downstream can see:
      # a chart reads the registry copy, so an image embedding a *stale* file would never be
      # caught anywhere else.
      #
      # `FROM scratch` has no shell, but `docker cp` does not need one — it reads the container's
      # filesystem without starting it.
      - name: Verify the embedded contract matches the exported one
        run: |
          container="$(docker create "${IMAGE}")"
          docker cp "${container}:/config/contract.json" from-image.json
          docker rm "${container}" > /dev/null
          if ! cmp from-image.json contract-out/contract.json; then
            echo "::error::/config/contract.json in the ${{ matrix.arch }} image is not the document this build generated."
            exit 1
          fi
          echo "The ${{ matrix.arch }} image's embedded contract matches the exported one."

      - name: Test Docker image runs
        run: |
          # `webhook.paths` is a table, so it comes from the config file the image reads at
          # `/app/config.toml`. The scalars stay on the command line to keep both layers
          # exercised.
          cat > "${RUNNER_TEMP}/config.toml" <<'EOF'
          [webhook]
          target_base = "https://example.invalid"

          [webhook.paths]
          "/webhook/.*" = ["ALL"]
          EOF

          docker run -d --name smoke-test -p 8080:8080 \
            -v "${RUNNER_TEMP}/config.toml:/app/config.toml:ro" \
            -e WEBHOOK_REDIRECT_SERVER__HOST=0.0.0.0 \
            -e WEBHOOK_REDIRECT_SERVER__PORT=8080 \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_ID=ci-client-id \
            -e WEBHOOK_REDIRECT_CLOUDFLARE__CLIENT_SECRET=ci-client-secret \
            "${IMAGE}"

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Health check passed on ${{ matrix.platform }}"
              exit 0
            fi
            sleep 1
          done

          echo "::error::Container did not become healthy on ${{ matrix.platform }}"
          docker logs smoke-test
          exit 1

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke-test || true

      - name: Check image size
        id: size-check
        run: |
          SIZE=$(docker image inspect "${IMAGE}" --format='{{.Size}}' | awk '{print int($1/1024/1024)}')
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE}MB"
          if [ $SIZE -gt 150 ]; then
            echo "::warning::Image size (${SIZE}MB) exceeds 150MB threshold"
          fi

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-${{ matrix.arch }} # Keeps the per-architecture scans from overwriting each other

      - name: Comment image size on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        if: github.event_name == 'pull_request'
        env:
          SIZE: ${{ steps.size-check.outputs.size }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            const { SIZE, PLATFORM } = process.env;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🐳 Docker image size (\`${PLATFORM}\`): **${SIZE}MB**`
            });

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
