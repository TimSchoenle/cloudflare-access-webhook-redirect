name: Docs

# `README.md`, `config.example.toml` and `docs/config.contract.json` are generated. This workflow
# is what makes that claim true in both directions.
#
# All three come from `Config` by way of `cargo run --example config-schema`: the README's settings
# tables through `.github/templates/README.md.hbs`, and the other two directly. Adding a
# configuration key is therefore a change to one Rust struct, and the documentation follows on
# its own — the failure this replaces is a table that still describes the key that was renamed
# three releases ago.
#
# The contract is the same idea aimed at a deployment rather than a person: it is what the chart
# repository validates a rendered configuration against. Committing it makes a prefix change or a
# renamed key visible as a diff in the pull request that made it, one step before the container
# build would catch it against the image's labels. The Dockerfile's `LABEL` region rides along
# with it: the two are one generator run, and separating them is the one arrangement in which they
# can disagree.
#
# The writing is `just regenerate` — the same string a developer types — and the checking is
# `TimSchoenle/actions/actions/rust/config-contract`. Deliberately not the same tool: a checker
# that shares its implementation with the writer only ever proves the writer is self-consistent.
#
# On a pull request it renders and commits the result to the branch. The case that matters most
# is the release-please pull request: that commit is the one which changes `version` in
# `Cargo.toml`, so it is also the one where the README would otherwise start advertising the
# previous tag. Rendering here means the released README already points at the tag the merge is
# about to create.
#
# That half is two jobs. `render` runs the generators, which means running the pull request's
# code, so it holds no secret and only uploads what they wrote as a patch. `render-commit` holds
# the App token, executes nothing from the branch, and commits that patch only when every path in
# it is one of the four generated files.
#
# Everywhere it cannot commit — a push to `master`, a pull request from a fork — it verifies
# instead, writing nothing and failing if what is committed is stale. Without it, editing
# `README.md` directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [ master ]

# Not scoped to this workflow: any future workflow that also commits to the pull request branch
# has to queue behind this one. The API call that makes a verified commit rejects one whose
# parent has moved, so two writers racing would leave one failing for no reason a reader could
# act on. `cancel-in-progress: false` for the same reason — a cancelled run here means a branch
# left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions: { }

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render
    # Forks get no secrets, so the commit half below could not mint a token and their branch is not
    # in this repository anyway. `verify` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # This half runs the pull request's code — the `just` recipes, the generator example and the
    # payload script — so it holds no secret and no write token. It writes the regenerated files
    # into its own checkout and uploads them as a patch; `render-commit` below commits that patch
    # without running anything from the branch.
    permissions:
      contents: read # Required to checkout the code
    outputs:
      has_changes: ${{ steps.patch.outputs.has_changes }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The head of the pull request, not the merge commit: the render has to read the
      # `Cargo.toml` and the `Config` the pull request proposes, and the patch is committed to the
      # branch, so it has to be computed against the commit the branch points at. The SHA rather
      # than the branch name, so the patch's base is the commit `render-commit` checks the branch
      # against.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The recipes under `justfile` are what a developer runs before pushing, so CI runs them
      # rather than a second spelling of the same cargo invocation. A generated file that only
      # ever came out right on a runner is a generated file nobody can reproduce.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate config.example.toml
        run: just render toml > config.example.toml

      # The committed contract and the Dockerfile's `LABEL` region, so a key rename or a prefix
      # change shows up as a diff in the pull request that made it rather than as a label mismatch
      # in a container build later. No `--revision` or `--created`: they would make the document
      # differ on every run and the diff meaningless.
      - name: Regenerate the configuration contract
        run: just regenerate

      # The half of the payload no shared action can derive: the published image name and the two
      # configuration tables. Invoked through `bash` rather than executed: the repository is
      # authored on Windows, where git does not record the executable bit.
      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      # The other half, and the merge. `branch` is pinned to the default branch rather than left
      # to default to `github.ref_name`, which on a pull request is `<number>/merge`: the badge
      # and permalink URLs would then differ between this job and `verify`, and every merge would
      # fail the gate for a reason absent from the diff.
      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Written, not committed: the commit is `render-commit`'s, over every generated file at once.
      - name: Render the README
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}

      # Every generated path is named rather than left to default to `.`, so nothing else a step
      # left dirty in the workspace can ride along. `render-commit` holds the same list as its
      # allowlist and refuses a patch touching anything outside it.
      - name: Create Patch
        id: patch
        uses: TimSchoenle/actions/actions/common/create-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-create-patch-v1.1.0
        with:
          artifact_name: docs-render
          paths: README.md config.example.toml docs/config.contract.json Dockerfile

  render-commit:
    name: Commit Render
    needs: render
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.render.outputs.has_changes == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to fetch the commit the patch applies to
    steps:
      # Nothing from the branch runs here, so the egress this job needs is known in full: GitHub
      # for the checkout, the token and the commit, and the artifact service for the patch.
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # A second copy of the patch `commit-patch` downloads below, read only by the check that
      # follows.
      - name: Receive the patch for inspection
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-render
          path: ${{ runner.temp }}/docs-render-inspect

      # `allowed_paths` below can admit the Dockerfile only as a whole, and the Dockerfile is the
      # build recipe of the published image: a generator that rewrote a `RUN` line would have it
      # committed by the App, under the App's name. So the patch is applied to a scratch index on
      # top of the head commit - git plumbing only, nothing from the checkout runs - and the
      # result has to equal the head's Dockerfile everywhere outside the `terrace-config:labels`
      # markers, with each marker exactly once and nothing between them but `LABEL key="value"`
      # lines and their continuations, which is all `--format dockerfile` emits. A region in any
      # other shape fails here and is committed by nobody; regenerate it locally with
      # `just regenerate` and push it by hand.
      - name: Refuse Dockerfile changes outside the LABEL region
        env:
          PATCH_FILE: ${{ runner.temp }}/docs-render-inspect/changes.patch
          METADATA_FILE: ${{ runner.temp }}/docs-render-inspect/metadata.json
          BEGIN: '# terrace-config:labels:begin'
          END: '# terrace-config:labels:end'
        run: |
          set -euo pipefail
          # A patch computed against another commit is skipped by `commit-patch`, not committed;
          # the run for the new head checks its own.
          if [ "$(jq -r .base_sha "$METADATA_FILE")" != "$(git rev-parse HEAD)" ]; then
            echo "The patch was computed against another commit; commit-patch will skip it."
            exit 0
          fi
          work="$RUNNER_TEMP/dockerfile-check"
          mkdir -p "$work"
          export GIT_INDEX_FILE="$work/index"
          git read-tree HEAD
          git apply --cached --whitespace=nowarn --include=Dockerfile "$PATCH_FILE"
          git show HEAD:Dockerfile > "$work/before"
          git show :Dockerfile > "$work/after"
          if cmp -s "$work/before" "$work/after"; then
            echo "The patch does not change the Dockerfile."
            exit 0
          fi
          for marker in "$BEGIN" "$END"; do
            if [ "$(grep -cxF -- "$marker" "$work/after")" != 1 ]; then
              echo "::error file=Dockerfile::'${marker}' must appear exactly once."
              exit 1
            fi
          done
          if [ "$(grep -nxF -- "$BEGIN" "$work/after" | cut -d: -f1)" -gt "$(grep -nxF -- "$END" "$work/after" | cut -d: -f1)" ]; then
            echo "::error file=Dockerfile::'${BEGIN}' must come before '${END}'."
            exit 1
          fi
          outside() { awk -v b="$BEGIN" -v e="$END" '$0 == b { skip = 1; print "<region>"; next } $0 == e { skip = 0; next } !skip' "$1"; }
          if ! diff -u <(outside "$work/before") <(outside "$work/after"); then
            echo "::error file=Dockerfile::The patch changes the Dockerfile outside the LABEL region; nothing was committed."
            exit 1
          fi
          if ! awk -v b="$BEGIN" -v e="$END" '
            $0 == e { inside = 0 }
            inside {
              if (cont) { ok = $0 ~ /^[ \t]+[A-Za-z0-9._-]+="[^"\\$]*"( \\)?$/ }
              else { ok = $0 ~ /^LABEL [A-Za-z0-9._-]+="[^"\\$]*"( \\)?$/ }
              if (!ok) { print "unexpected line in the LABEL region: " $0; bad = 1 }
              cont = $0 ~ / \\$/
            }
            $0 == b { inside = 1; cont = 0 }
            END { exit (bad || cont) }
          ' "$work/after"; then
            echo "::error file=Dockerfile::The LABEL region holds something other than LABEL instructions; nothing was committed."
            exit 1
          fi
          echo "The patch changes only the LABEL region of the Dockerfile."

      # An App installation token, so the commit is verified and — unlike one made with
      # `GITHUB_TOKEN` — re-triggers the checks on the branch it lands on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the render job's output: that job ran the pull
      # request's code. One commit over every generated file, because a second commit would have to
      # name the head the first just moved. If `fmt-commit` committed first, the branch has moved
      # past the commit the patch was made from, and commit-patch skips it with
      # `outcome: branch_moved`; the new head starts a new run, which renders again.
      - name: Commit the generated files
        id: commit
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: docs-render
          # Exactly the files `render` writes. The Dockerfile is here only because `just
          # regenerate` rewrites its `terrace-config:labels` region; any other path fails this job.
          allowed_paths: 'README.md config.example.toml docs/config.contract.json Dockerfile'
          commit_message: 'docs: regenerate the README, config.example.toml and the configuration contract'

      - name: Summarise
        env:
          OUTCOME: ${{ steps.commit.outputs.outcome }}
          COMMIT_URL: ${{ steps.commit.outputs.commit_url }}
        run: |
          case "${OUTCOME}" in
            committed) echo "Generated files re-rendered: ${COMMIT_URL}" >> "$GITHUB_STEP_SUMMARY" ;;
            branch_moved) echo "The branch moved while rendering; the run for the new head renders again." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "README.md, config.example.toml and the configuration contract already matched their sources." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

  verify:
    name: Verify
    # The complement of `render`: it covers the pushes to `master` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # The same recipe the render job writes `config.example.toml` with, so this job cannot fail
      # a file that `just` would have produced identically.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-readme-variables-v1.2.9
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-common-render-template-v1.2.9
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify config.example.toml is current
        run: |
          just render toml > config.example.toml
          git diff --exit-code -- config.example.toml

      # The reverse gate, for the contract document and for the Dockerfile's `LABEL` region at
      # once: a renamed key or a changed prefix cannot reach `master` while either still describes
      # the old surface — which is what the chart repository would otherwise vendor, and what an
      # image would otherwise advertise.
      #
      # It renders its own copy rather than diffing against a file this job wrote, so a document
      # that is *missing* is a finding rather than a path `git diff` has nothing to say about.
      #
      # `image` is empty, so the two checks that need one are skipped and this job stays the cheap
      # half: it reports a renamed key without waiting for a container build. The expensive half
      # is `build.yaml`, which runs the same action against the image it just built.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          features: config-schema
          image: ''
