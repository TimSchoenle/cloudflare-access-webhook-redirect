name: Docs

# The generated documents are rendered and committed on a pull request by the `render` job in
# generate.yaml and by generate-commit.yaml. This workflow is the other direction: wherever
# nothing commits (a push to the default branch, a pull request from a fork) it renders in
# `check` mode, writing nothing and failing when a committed file is stale. Without it, editing
# a generated page directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

env:
  CARGO_TERM_COLOR: always

jobs:

  verify:
    name: Verify
    # The complement of `render` in generate.yaml: it covers the pushes to `master` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1

      # The same recipe the render job writes `config.example.toml` with, so this job cannot fail
      # a file that `just` would have produced identically.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Generate the configuration payload
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-readme-variables-v2.1.1
        with:
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-common-render-template-v3.0.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: true

      - name: Verify config.example.toml is current
        run: |
          just render toml > config.example.toml
          git diff --exit-code -- config.example.toml

      # The reverse gate, for the contract document and for the Dockerfile's `LABEL` region at
      # once: a renamed key or a changed prefix cannot reach `master` while either still describes
      # the old surface — which is what the chart repository would otherwise vendor, and what an
      # image would otherwise advertise.
      #
      # It renders its own copy rather than diffing against a file this job wrote, so a document
      # that is *missing* is a finding rather than a path `git diff` has nothing to say about.
      #
      # `image` is empty, so the two checks that need one are skipped and this job stays the cheap
      # half: it reports a renamed key without waiting for a container build. The expensive half
      # is `build.yaml`, which runs the same action against the image it just built.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@dc5b395636dc1954383f11af4062a08814e9b15a # tag=actions-rust-config-contract-v2.0.1
        with:
          features: config-schema
          image: ''
