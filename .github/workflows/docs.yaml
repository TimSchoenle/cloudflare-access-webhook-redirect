name: Docs

# `README.md`, `config.example.toml` and `docs/config.contract.json` are generated. This workflow
# is what makes that claim true in both directions.
#
# All three come from `Config` by way of `cargo run --example config-schema`: the README's settings
# tables through `.github/templates/README.md.hbs`, and the other two directly. Adding a
# configuration key is therefore a change to one Rust struct, and the documentation follows on
# its own — the failure this replaces is a table that still describes the key that was renamed
# three releases ago.
#
# The contract is the same idea aimed at a deployment rather than a person: it is what the chart
# repository validates a rendered configuration against. Committing it makes a prefix change or a
# renamed key visible as a diff in the pull request that made it, one step before the container
# build would catch it against the image's labels. The Dockerfile's `LABEL` region rides along
# with it: the two are one generator run, and separating them is the one arrangement in which they
# can disagree.
#
# The writing is `just regenerate` — the same string a developer types — and the checking is
# `TimSchoenle/actions/actions/rust/config-contract`. Deliberately not the same tool: a checker
# that shares its implementation with the writer only ever proves the writer is self-consistent.
#
# On a pull request it renders and commits the result to the branch. The case that matters most
# is the release-please pull request: that commit is the one which changes `version` in
# `Cargo.toml`, so it is also the one where the README would otherwise start advertising the
# previous tag. Rendering here means the released README already points at the tag the merge is
# about to create.
#
# Everywhere it cannot commit — a push to `master`, a pull request from a fork — it verifies
# instead, writing nothing and failing if what is committed is stale. Without it, editing
# `README.md` directly would appear to work right up until the next pull request silently
# reverted it.

on:
  pull_request:
  push:
    branches: [ master ]

# Not scoped to this workflow: any future workflow that also commits to the pull request branch
# has to queue behind this one. The API call that makes a verified commit rejects one whose
# parent has moved, so two writers racing would leave one failing for no reason a reader could
# act on. `cancel-in-progress: false` for the same reason — a cancelled run here means a branch
# left holding a half-generated file.
concurrency:
  group: branch-writes-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

env:
  CARGO_TERM_COLOR: always

jobs:
  render:
    name: Render
    # Forks get no secrets, so the App token would be empty and the commit could not be pushed to
    # their branch anyway. `verify` below picks those pull requests up instead.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # the writes happen with the App token below, not with GITHUB_TOKEN
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      # An App installation token, so the commits are verified and — unlike ones made with
      # `GITHUB_TOKEN` — re-trigger the checks on the branch they land on.
      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write

      # The head of the branch, not the merge commit: the render has to read the `Cargo.toml` and
      # the `Config` the pull request proposes, and the commits have to land on top of what is
      # there now.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # The recipes under `justfile` are what a developer runs before pushing, so CI runs them
      # rather than a second spelling of the same cargo invocation. A generated file that only
      # ever came out right on a runner is a generated file nobody can reproduce.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Regenerate config.example.toml
        run: just render toml > config.example.toml

      # The committed contract and the Dockerfile's `LABEL` region, so a key rename or a prefix
      # change shows up as a diff in the pull request that made it rather than as a label mismatch
      # in a container build later. No `--revision` or `--created`: they would make the document
      # differ on every run and the diff meaningless.
      - name: Regenerate the configuration contract
        run: just regenerate

      - name: Collect README variables
        id: variables
        # Invoked through `bash` rather than executed: the repository is authored on Windows,
        # where git does not record the executable bit.
        run: echo "json=$(bash .github/scripts/readme-variables.sh)" >> "$GITHUB_OUTPUT"

      - name: Render and commit the README
        id: readme
        uses: TimSchoenle/actions/actions/common/render-template-and-commit@15d83f02081c9dc8a844646199c63792dcccdfa8 # tag=actions-common-render-template-and-commit-v1.1.3
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.json }}
          token: ${{ steps.generate_token.outputs.token }}
          commit_message: 'docs: render README from template'

      # A second commit rather than one `file_pattern` covering both, because the two artefacts
      # change independently: a `#[config(note)]` reaches the example file without touching a
      # table cell, and the README's own prose changes without the example moving at all. The
      # commit API re-reads the branch head, so this lands on top of the one above.
      - name: Commit config.example.toml
        id: example
        uses: TimSchoenle/actions/actions/common/commit-changes@76719ba61e9b9cf1ffafdc3cb895308055a7f3bd # tag=actions-common-commit-changes-v1.3.2
        with:
          commit_message: 'docs: regenerate config.example.toml'
          file_pattern: 'config.example.toml'
          token: ${{ steps.generate_token.outputs.token }}

      # A third commit, for the same reason the second is separate: the contract moves when the
      # configuration surface moves, which is not when the README's prose does.
      #
      # The Dockerfile is in the same commit as the document rather than one of its own. The
      # region and the document are one generator run over one source tree, and a branch carrying
      # one without the other is a branch whose image advertises a contract it does not publish.
      # Both paths are named rather than left to default to `.`, so nothing else a step left dirty
      # in the workspace can ride along in a commit that claims to be about the contract.
      - name: Commit the configuration contract
        id: contract
        uses: TimSchoenle/actions/actions/common/commit-changes@76719ba61e9b9cf1ffafdc3cb895308055a7f3bd # tag=actions-common-commit-changes-v1.3.2
        with:
          commit_message: 'docs: regenerate the configuration contract'
          file_pattern: 'docs/config.contract.json Dockerfile'
          token: ${{ steps.generate_token.outputs.token }}

      - name: Summarise
        env:
          README_COMMITTED: ${{ steps.readme.outputs.changes_detected }}
          README_URL: ${{ steps.readme.outputs.commit_url }}
          EXAMPLE_COMMITTED: ${{ steps.example.outputs.changes_detected }}
          EXAMPLE_URL: ${{ steps.example.outputs.commit_url }}
          CONTRACT_COMMITTED: ${{ steps.contract.outputs.changes_detected }}
          CONTRACT_URL: ${{ steps.contract.outputs.commit_url }}
        run: |
          if [ "${README_COMMITTED}" = "true" ]; then
            echo "README.md re-rendered: ${README_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "README.md already matched its template." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${EXAMPLE_COMMITTED}" = "true" ]; then
            echo "config.example.toml regenerated: ${EXAMPLE_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "config.example.toml already matched the schema." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${CONTRACT_COMMITTED}" = "true" ]; then
            echo "The configuration contract and the Dockerfile's LABEL region were regenerated: ${CONTRACT_URL}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The configuration contract and the Dockerfile's LABEL region already matched the schema." >> "$GITHUB_STEP_SUMMARY"
          fi

  verify:
    name: Verify
    # The complement of `render`: it covers the pushes to `master` that no pull request rendered,
    # and the fork pull requests that could not be committed to. Between the two conditions every
    # event this workflow sees is handled by exactly one job.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0

      # The same recipe the render job writes `config.example.toml` with, so this job cannot fail
      # a file that `just` would have produced identically.
      - name: Install just
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: just

      - name: Collect README variables
        id: variables
        run: echo "json=$(bash .github/scripts/readme-variables.sh)" >> "$GITHUB_OUTPUT"

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@3b7d152374ee63e720e7c16bed8b088b40554911 # tag=actions-common-render-template-v1.1.1
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.json }}
          check: true

      - name: Verify config.example.toml is current
        run: |
          just render toml > config.example.toml
          git diff --exit-code -- config.example.toml

      # The reverse gate, for the contract document and for the Dockerfile's `LABEL` region at
      # once: a renamed key or a changed prefix cannot reach `master` while either still describes
      # the old surface — which is what the chart repository would otherwise vendor, and what an
      # image would otherwise advertise.
      #
      # It renders its own copy rather than diffing against a file this job wrote, so a document
      # that is *missing* is a finding rather than a path `git diff` has nothing to say about.
      #
      # `image` is empty, so the two checks that need one are skipped and this job stays the cheap
      # half: it reports a renamed key without waiting for a container build. The expensive half
      # is `build.yaml`, which runs the same action against the image it just built.
      - name: Verify the configuration contract
        uses: TimSchoenle/actions/actions/rust/config-contract@99c83581b3486a8a9f28e43226b8f02025fcdf9a # tag=actions-rust-config-contract-v1.1.0
        with:
          features: config-schema
          image: ''
