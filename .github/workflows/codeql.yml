name: CodeQL

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ '**' ]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@f33849da61e2397d3a9277762d09a1bf0d2b9d7c # tag=actions-security-codeql-v1.1.2
        with:
          language: ${{ matrix.language }}
