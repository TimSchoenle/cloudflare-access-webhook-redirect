name: CodeQL

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ '**' ]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-security-codeql-v1.1.10
        with:
          language: ${{ matrix.language }}
