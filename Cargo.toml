[package]
name = "cloudflare-access-webhook-redirect"
version = "1.3.0"
edition = "2024"
# Read by `.github/workflows/docs.yaml` into the rendered README, which is why they are here and
# not only in the repository's GitHub metadata: a description edited in the web UI would change
# the README with no commit behind it.
description = "Reverse proxy exposing chosen paths of a Cloudflare Access protected service, with the service token injected."
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "cloudflare-access-webhook-redirect"

# The generator behind the README's settings table and `config.example.toml`. An example rather
# than a binary: it is a documentation tool, and shipping it in the image would mean the release
# build carrying `terrace-config/schema-cli` for something no container ever runs.
[[example]]
name = "config-schema"
required-features = ["config-schema"]

[features]
default = []
# Describes the configuration surface instead of only loading it, which is what
# `.github/workflows/docs.yaml` renders the settings table and `config.example.toml` from.
#
# Off by default because the release image never runs the generator: leaving it on would compile
# the `Describe` derive and serde's serialiser for every config struct into a binary that only
# ever deserialises them.
#
# `schema-cli` rather than `schema`: the generator itself — the `--format` vocabulary, the
# argument parsing and the dispatch across the nine renderings — is the crate's now, and what is
# left in `examples/config-schema.rs` is this service's own. It costs no dependency `schema` did
# not already pull in.
config-schema = ["terrace-config/schema-cli"]

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
thiserror = "2.0.0"
backtrace = "0.3.76"
actix-web = "4.11.0"
tracing-actix-web = "0.7.19"
# Layered configuration: struct defaults, TOML, environment, secrets directory, `_FILE`
# indirection — plus the supervisor that rebuilds the service when a mounted file changes.
# Pinned by tag: a branch dependency lets `cargo update` move across arbitrary commits.
#
# Named features rather than `full`, which also carries `schema` and `schema-cli`: both are the
# documentation generator and belong behind this crate's own `config-schema` feature, not in the
# image. What is left is what the service does at runtime — load, reload, and say where each
# value came from.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.9.0", features = ["loader", "reload", "explain"] }
serde = "1.0.209"
serde_json = "1.0.145"
reqwest = { version = "0.13.0", features = ["json", "query"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
secrecy = { version = "0.10.3", features = ["serde"] }
regex = "1.12.2"
getset = "0.1.6"
derive-new = "0.7.0"
sentry = { version = "0.49.0", features = ["anyhow", "debug-images", "reqwest", "backtrace"] }

[dev-dependencies]
http = "=1.5.0"
# The loader's own test harness: a jail whose `config`, `secret` and `env_key` methods derive
# every name from the `Terrace` they were built over, so a test cannot keep passing against a
# variable the loader no longer reads. Deliberately outside `full`, so it is asked for here.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.9.0", features = ["testing"] }
# Still direct for the per-block deserialisation tests, which extract one `[telemetry]` or
# `[webhook]` table and never touch the layering the harness exists for. Same figment
# `terrace-config` resolves.
figment = { version = "=0.10.19", features = ["test"] }
serde_test = "=1.0.177"
lazy_static = "=1.5.0"
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1