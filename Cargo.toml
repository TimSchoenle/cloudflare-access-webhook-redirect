[package]
name = "cloudflare-access-webhook-redirect"
version = "2.3.0"
edition = "2024"
# Read by `.github/workflows/docs.yaml` into the rendered README, which is why they are here and
# not only in the repository's GitHub metadata: a description edited in the web UI would change
# the README with no commit behind it.
description = "Reverse proxy exposing chosen paths of a Cloudflare Access protected service, with the service token injected."
license = "GPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "cloudflare-access-webhook-redirect"

# The generator behind the README's settings table and `config.example.toml`. An example rather
# than a binary: it is a documentation tool, and shipping it in the image would mean the release
# build carrying `terrace-config/schema-cli` for something no container ever runs.
[[example]]
name = "config-schema"
required-features = ["config-schema"]

[features]
default = []
# Describes the configuration surface instead of only loading it, which is what
# `.github/workflows/docs.yaml` renders the settings table and `config.example.toml` from.
#
# Off by default because the release image never runs the generator: leaving it on would compile
# the `Describe` derive and serde's serialiser for every config struct into a binary that only
# ever deserialises them.
#
# `schema-cli` rather than `schema`: the generator itself — the `--format` vocabulary, the
# argument parsing and the dispatch across the nine renderings — is the crate's now, and what is
# left in `examples/config-schema.rs` is this service's own. It costs no dependency `schema` did
# not already pull in.
config-schema = ["terrace-config/schema-cli"]

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
thiserror = "2.0.0"
backtrace = "0.3.76"
actix-web = "4.11.0"
tracing-actix-web = "0.7.19"
# Layered configuration: struct defaults, TOML, environment, secrets directory, `_FILE`
# indirection — plus the supervisor that rebuilds the service when a mounted file changes.
# Pinned by tag: a branch dependency lets `cargo update` move across arbitrary commits.
#
# Named features rather than `full`, which also carries `schema` and `schema-cli`: both are the
# documentation generator and belong behind this crate's own `config-schema` feature, not in the
# image. What is left is what the service does at runtime — load, reload, and say where each
# value came from.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.11.0", features = ["loader", "reload", "explain"] }
serde = "1.0.209"
serde_json = "1.0.145"
reqwest = { version = "0.13.0", features = ["json", "query"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
secrecy = { version = "0.10.3", features = ["serde"] }
regex = "1.12.2"
getset = "0.1.6"
derive-new = "0.7.0"
# Error reporting and performance tracing, off unless an operator turns `[telemetry.sentry]` on
# (`src/telemetry.rs`). One crate rather than three: `sentry` re-exports `sentry-tracing` and
# `sentry-actix` under `sentry::integrations::*`, so the three versions cannot drift.
#
# `default-features = false` and then back on by name, because three of the defaults are separate
# Sentry products this service does not use — `logs`, `metrics` and `release-health` — and each
# one is an egress channel that would exist with no key in the settings table describing it.
#
# `contexts` is deliberately off, and it is a default. It adds an OS/host/runtime tag block by
# pulling `os_info`, which carries a fifteen-crate `objc2` tree for its macOS support into
# `Cargo.lock` for platforms no image here targets. What it would report — kernel version, arch,
# rustc version — is a constant of the image the release tag already names.
#
# What is on: `backtrace`/`debug-images` (stack traces and the module list that symbolicates
# them), `panic` (the hook that turns a panic into an issue), `transport` (`reqwest` +
# `native-tls`, which is the client and the TLS stack the proxy itself already builds, so the
# sender adds nothing to the graph), and the two integrations: `tracing` for the subscriber layer
# that feeds issues and breadcrumbs, and `actix` for the per-request hub and the request
# transaction.
#
# `anyhow` is gone with them, and was never used: `crate::Result` is `Result<T, crate::Error>`
# through an alias, and nothing here captures an `anyhow::Error`.
sentry = { version = "0.49.1", default-features = false, features = [
    "actix",
    "backtrace",
    "debug-images",
    "panic",
    "tracing",
    "transport",
] }

[dev-dependencies]
http = "=1.5.0"
# The loader's own test harness: a jail whose `config`, `secret` and `env_key` methods derive
# every name from the `Terrace` they were built over, so a test cannot keep passing against a
# variable the loader no longer reads. Deliberately outside `full`, so it is asked for here.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.11.0", features = ["testing"] }
# Still direct for the per-block deserialisation tests, which extract one `[telemetry]` or
# `[webhook]` table and never touch the layering the harness exists for. Same figment
# `terrace-config` resolves.
figment = { version = "=0.10.19", features = ["test"] }
serde_test = "=1.0.177"
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1

# Declared on the workspace even though there is one member, so a second crate added here cannot
# be held to a looser standard than this one.
[lints]
workspace = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Already inside `pedantic`. Named again so the next reader can see they are deliberate rather
# than swept in with the group.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
too_long_first_doc_paragraph = "warn"
doc_link_with_quotes = "warn"
doc_broken_link = "warn"
doc_include_without_cfg = "warn"

[workspace.lints.rustdoc]
# Denied rather than warned: a broken link renders as the literal `[`Foo`]` text, so it is
# invisible to the person reading the page and visible only to the person who wrote it.
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
unescaped_backticks = "warn"