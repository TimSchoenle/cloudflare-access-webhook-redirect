[package]
name = "cloudflare-access-webhook-redirect"
version = "1.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "cloudflare-access-webhook-redirect"

[dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
thiserror = "2.0.0"
backtrace = "0.3.76"
actix-web = "4.11.0"
tracing-actix-web = "0.7.19"
# Layered configuration: struct defaults, TOML, environment, secrets directory, `_FILE`
# indirection — plus the supervisor that rebuilds the service when a mounted file changes.
# Pinned by tag: a branch dependency lets `cargo update` move across arbitrary commits.
terrace-config = { git = "https://github.com/TimSchoenle/terrace-config", tag = "v0.2.0", features = ["full"] }
serde = "1.0.209"
serde_json = "1.0.145"
reqwest = { version = "0.13.0", features = ["json", "query"] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.19"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
secrecy = { version = "0.10.3", features = ["serde"] }
regex = "1.12.2"
getset = "0.1.6"
derive-new = "0.7.0"
sentry = { version = "0.47.0", features = ["anyhow", "debug-images", "reqwest", "backtrace"] }

[dev-dependencies]
http = "=1.5.0"
# `figment::Jail` builds the config files and environment a test needs and restores both
# afterwards, which is how the config tests avoid `env::set_var`. Same figment
# `terrace-config` resolves, plus its `test` feature.
figment = { version = "=0.10.19", features = ["test"] }
serde_test = "=1.0.177"
lazy_static = "=1.5.0"
wiremock = "=0.6.5"

[profile.release]
lto = true
codegen-units = 1